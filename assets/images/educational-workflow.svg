<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 800 600" 
     width="800" 
     height="600" 
     aria-labelledby="svg-title"
     role="img">
  
  <title id="svg-title">Diagrama de flujo educativo de Renaissance HTML5 Edition</title>
  <desc>Diagrama circular que muestra los cuatro pasos del proceso educativo: Seleccionar documento, Elegir perfil, Seleccionar formato, Recibir material adaptado. Cada paso está conectado por flechas en sentido horario.</desc>
  
  <!-- Estilos internos -->
  <style>
    .background {
      fill: #FCFCF9;
    }
    
    .step-circle {
      fill: #FFFFFF;
      stroke: #2E5C8A;
      stroke-width: 3;
    }
    
    .step-circle:hover {
      stroke: #1A3A5C;
      stroke-width: 4;
    }
    
    .step-icon {
      font-size: 40px;
    }
    
    .step-title {
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      font-size: 18px;
      font-weight: 600;
      fill: #111110;
      text-anchor: middle;
    }
    
    .step-description {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      fill: #555552;
      text-anchor: middle;
    }
    
    .arrow {
      stroke: #2E5C8A;
      stroke-width: 3;
      fill: none;
      marker-end: url(#arrowhead);
    }
    
    .arrow:hover {
      stroke: #1A3A5C;
    }
    
    .center-title {
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      font-size: 24px;
      font-weight: 600;
      fill: #111110;
      text-anchor: middle;
    }
    
    .center-subtitle {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      fill: #555552;
      text-anchor: middle;
    }
    
    .brand-color {
      fill: #2E5C8A;
    }
    
    .step-number {
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      font-size: 28px;
      font-weight: 600;
      fill: #2E5C8A;
      text-anchor: middle;
    }
  </style>
  
  <!-- Definición de marcador para flechas -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E5C8A"/>
    </marker>
  </defs>
  
  <!-- Fondo -->
  <rect class="background" x="0" y="0" width="800" height="600" rx="12"/>
  
  <!-- Título central -->
  <text class="center-title" x="400" y="80">Flujo Educativo</text>
  <text class="center-subtitle" x="400" y="110">Renaissance HTML5 Edition</text>
  
  <!-- Centro del diagrama -->
  <circle cx="400" cy="300" r="120" fill="none" stroke="#E5E5E2" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Paso 1: Seleccionar documento -->
  <g transform="translate(400, 150)" id="step1">
    <circle class="step-circle" cx="0" cy="0" r="60"/>
    <text class="step-number" x="0" y="-35">1</text>
    <text class="step-title" x="0" y="10">Seleccionar</text>
    <text class="step-description" x="0" y="30">documento</text>
    <!-- Icono de libro -->
    <g transform="translate(0, -40)">
      <rect x="-15" y="-15" width="30" height="20" rx="2" fill="#2E5C8A"/>
      <path d="M -15 -15 L -15 -5 L 15 -5 L 15 -15 Z" fill="#1A3A5C"/>
      <line x1="-10" y1="-10" x2="10" y2="-10" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="-10" y1="-5" x2="10" y2="-5" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#FFFFFF" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Paso 2: Elegir perfil -->
  <g transform="translate(550, 300)" id="step2">
    <circle class="step-circle" cx="0" cy="0" r="60"/>
    <text class="step-number" x="0" y="-35">2</text>
    <text class="step-title" x="0" y="10">Elegir</text>
    <text class="step-description" x="0" y="30">perfil</text>
    <!-- Icono de usuario -->
    <g transform="translate(0, -40)">
      <circle cx="0" cy="0" r="15" fill="#2E5C8A"/>
      <circle cx="0" cy="-8" r="8" fill="#FFFFFF"/>
      <path d="M -10 10 Q 0 5, 10 10 Q 0 15, -10 10" fill="#2E5C8A"/>
    </g>
  </g>
  
  <!-- Paso 3: Seleccionar formato -->
  <g transform="translate(400, 450)" id="step3">
    <circle class="step-circle" cx="0" cy="0" r="60"/>
    <text class="step-number" x="0" y="-35">3</text>
    <text class="step-title" x="0" y="10">Seleccionar</text>
    <text class="step-description" x="0" y="30">formato</text>
    <!-- Icono de lista -->
    <g transform="translate(0, -40)">
      <rect x="-15" y="-15" width="30" height="25" rx="2" fill="none" stroke="#2E5C8A" stroke-width="2"/>
      <line x1="-12" y1="-10" x2="12" y2="-10" stroke="#2E5C8A" stroke-width="2"/>
      <line x1="-12" y1="-5" x2="12" y2="-5" stroke="#2E5C8A" stroke-width="2"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#2E5C8A" stroke-width="2"/>
      <line x1="-12" y1="5" x2="12" y2="5" stroke="#2E5C8A" stroke-width="2"/>
      <circle cx="-10" y1="-10" r="2" fill="#2E5C8A"/>
      <circle cx="-10" y1="-5" r="2" fill="#2E5C8A"/>
      <circle cx="-10" y1="0" r="2" fill="#2E5C8A"/>
    </g>
  </g>
  
  <!-- Paso 4: Recibir material -->
  <g transform="translate(250, 300)" id="step4">
    <circle class="step-circle" cx="0" cy="0" r="60"/>
    <text class="step-number" x="0" y="-35">4</text>
    <text class="step-title" x="0" y="10">Recibir</text>
    <text class="step-description" x="0" y="30">material</text>
    <text class="step-description" x="0" y="48">adaptado</text>
    <!-- Icono de descarga -->
    <g transform="translate(0, -40)">
      <rect x="-15" y="-15" width="30" height="20" rx="2" fill="#2E5C8A"/>
      <polygon points="-8, -5 8, -5 0, 5" fill="#FFFFFF"/>
      <line x1="0" y1="-2" x2="0" y2="8" stroke="#FFFFFF" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Flechas conectoras -->
  <!-- Flecha de paso 1 a paso 2 -->
  <path class="arrow" d="M 455 170 Q 500 200, 540 280" />
  
  <!-- Flecha de paso 2 a paso 3 -->
  <path class="arrow" d="M 560 360 Q 500 400, 410 430" />
  
  <!-- Flecha de paso 3 a paso 4 -->
  <path class="arrow" d="M 350 460 Q 300 400, 260 350" />
  
  <!-- Flecha de paso 4 a paso 1 -->
  <path class="arrow" d="M 205 290 Q 250 200, 340 180" />
  
  <!-- Cargo adicional: texto en las esquinas -->
  <text x="50" y="590" class="step-description" fill="#999995">
    Proceso educativo basado en perfiles de aprendizaje
  </text>
  
  <text x="750" y="590" class="step-description" fill="#999995">
    UVM - E-Actividad 2.1
  </text>
</svg>
